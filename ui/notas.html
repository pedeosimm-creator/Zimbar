<!DOCTYPE html>
<html lang="pt-BR" class="zn-solo"><head><meta charset="utf-8">
<title>ZimNotes</title>
<link rel="icon" href="z.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="notas.css">
</head><body>

<!-- A janela é sem moldura: esta barra é o cabeçalho que se arrasta. -->
<div class="zn-barra-janela" id="znBarraJanela">
  <div class="marca">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M15 3v4h4"/></svg>
    ZimNotes
  </div>
  <button id="jnMin" title="minimizar">–</button>
  <button id="jnMax" title="maximizar">▢</button>
  <button id="jnFec" class="x" title="fechar">✕</button>
</div>

<div id="znRaiz"></div>

<script src="notas.js"></script>
<script>
/* ═══ A JANELA ═══
   Só o que o navegador não faz sozinho: arrastar, redimensionar e os três
   botões do canto. O resto do ZimNotes é o mesmo notas.js do Zimbar. */
const nativo = !!(window.chrome && window.chrome.webview);
const mandar = (msg) => nativo && window.chrome.webview.postMessage(JSON.stringify(msg));

const barra = document.getElementById('znBarraJanela');
barra.addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('button')) return;
  mandar({ acao: 'arrastar' });
});
barra.addEventListener('dblclick', e => {
  if (!e.target.closest('button')) mandar({ acao: 'maximizar' });
});
document.getElementById('jnMin').onclick = () => mandar({ acao: 'minimizar' });
document.getElementById('jnMax').onclick = () => mandar({ acao: 'maximizar' });
document.getElementById('jnFec').onclick = () => mandar({ acao: 'fechar' });

/* faixas invisíveis nas beiradas: é por elas que o Windows redimensiona */
if (nativo) {
  const E = 6;
  const lados = [
    ['n', 'left:0;right:0;top:0;height:' + E + 'px', 'ns-resize'],
    ['s', 'left:0;right:0;bottom:0;height:' + E + 'px', 'ns-resize'],
    ['w', 'top:0;bottom:0;left:0;width:' + E + 'px', 'ew-resize'],
    ['e', 'top:0;bottom:0;right:0;width:' + E + 'px', 'ew-resize'],
    ['nw', 'left:0;top:0;width:14px;height:14px', 'nwse-resize'],
    ['ne', 'right:0;top:0;width:14px;height:14px', 'nesw-resize'],
    ['sw', 'left:0;bottom:0;width:14px;height:14px', 'nesw-resize'],
    ['se', 'right:0;bottom:0;width:14px;height:14px', 'nwse-resize']
  ];
  for (const [borda, pos, cursor] of lados) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;z-index:9999;' + pos + ';cursor:' + cursor;
    el.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      mandar({ acao: 'redimensionar', borda });
    });
    document.body.appendChild(el);
  }
}

/* o tema acompanha o do Zimbar, que fica gravado aqui do lado */
document.documentElement.dataset.theme =
  localStorage.getItem('zimbar-tema') === 'escuro' ? 'dark' : '';

ZimNotes.montar(document.getElementById('znRaiz'));
</script>
</body></html>
